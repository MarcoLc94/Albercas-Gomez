<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170" fill="none">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5794a"/>
      <stop offset="1" stop-color="#7e4d2a"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d3da"/>
    </linearGradient>
    <radialGradient id="water" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#8cecf3"/>
      <stop offset="0.6" stop-color="#25b0d0"/>
      <stop offset="1" stop-color="#0a6c98"/>
    </radialGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eff3"/>
      <stop offset="1" stop-color="#b9c6cf"/>
    </linearGradient>
    <clipPath id="basin"><rect x="68" y="62" width="84" height="66" rx="20"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <style>
    .wisp, .sway {
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    /* Sube desde el agua, se abre un poco y se disipa; se reinicia en bucle */
    .wisp {
      animation: steam-rise 4.2s ease-in-out infinite;
    }
    /* Vaivén lateral que hace parecer que el vapor ondea */
    .sway {
      animation: steam-sway 2.4s ease-in-out infinite;
    }
    .w1 { animation-duration: 4.2s; animation-delay: -0.6s; }
    .w2 { animation-duration: 4.8s; animation-delay: -2.4s; }
    .w3 { animation-duration: 4.4s; animation-delay: -3.4s; }
    .w1 .sway { animation-duration: 2.6s; }
    .w2 .sway { animation-duration: 3.1s; animation-direction: reverse; }
    .w3 .sway { animation-duration: 2.8s; animation-delay: -1s; }

    @keyframes steam-rise {
      0%   { opacity: 0;   transform: translateY(9px) scale(0.85, 0.7); }
      25%  { opacity: 1; }
      70%  { opacity: 0.85; }
      100% { opacity: 0;   transform: translateY(-7px) scale(1.05, 1.08); }
    }
    @keyframes steam-sway {
      0%, 100% { transform: skewX(-9deg) scaleX(0.9); }
      50%      { transform: skewX(9deg) scaleX(1.12); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wisp, .sway { animation: none; }
    }
  </style>

  <!-- Terraza de madera -->
  <rect x="10" y="30" width="200" height="130" rx="10" fill="url(#wood)" filter="url(#shadow)"/>
  <g stroke="#4f2f16" stroke-opacity="0.45" stroke-width="1">
    <path d="M10 43H210M10 56H210M10 69H210M10 82H210M10 95H210M10 108H210M10 121H210M10 134H210M10 147H210"/>
  </g>
  <g stroke="#f0c896" stroke-opacity="0.25" stroke-width="1">
    <path d="M10 44H210M10 57H210M10 70H210M10 83H210M10 96H210M10 109H210M10 122H210M10 135H210M10 148H210"/>
  </g>

  <!-- Carcasa del spa -->
  <rect x="50" y="44" width="120" height="102" rx="28" fill="url(#shell)" filter="url(#shadow)"/>
  <rect x="50" y="44" width="120" height="102" rx="28" stroke="#aebbc4" stroke-width="1"/>

  <!-- Asiento perimetral -->
  <rect x="60" y="54" width="100" height="82" rx="23" fill="url(#seat)" stroke="#9fb0bb" stroke-width="0.8"/>

  <!-- Agua -->
  <rect x="68" y="62" width="84" height="66" rx="20" fill="url(#water)"/>
  <g clip-path="url(#basin)">
    <rect x="68" y="62" width="84" height="66" rx="20" stroke="#0a5d84" stroke-opacity="0.5" stroke-width="6"/>
    <g stroke="#ffffff" fill="none" stroke-linecap="round">
      <ellipse cx="110" cy="95" rx="26" ry="18" stroke-opacity="0.35" stroke-width="1.6"/>
      <ellipse cx="110" cy="95" rx="15" ry="10" stroke-opacity="0.4" stroke-width="1.4"/>
      <path d="M76 78q8-5 16 0t16 0" stroke-opacity="0.35" stroke-width="1.5"/>
      <path d="M116 112q8-5 16 0t16 0" stroke-opacity="0.3" stroke-width="1.5"/>
    </g>
    <g fill="#ffffff">
      <circle cx="100" cy="88" r="3" fill-opacity="0.55"/>
      <circle cx="108" cy="82" r="2" fill-opacity="0.5"/>
      <circle cx="120" cy="90" r="3.4" fill-opacity="0.5"/>
      <circle cx="126" cy="100" r="2.2" fill-opacity="0.55"/>
      <circle cx="96" cy="102" r="2.4" fill-opacity="0.5"/>
      <circle cx="112" cy="106" r="3" fill-opacity="0.55"/>
      <circle cx="104" cy="98" r="1.6" fill-opacity="0.6"/>
      <circle cx="118" cy="78" r="1.6" fill-opacity="0.5"/>
      <circle cx="134" cy="88" r="1.8" fill-opacity="0.5"/>
    </g>
    <ellipse cx="90" cy="72" rx="20" ry="4.5" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Jets -->
  <g fill="#f4f8fa" stroke="#7d8e99" stroke-width="0.9">
    <circle cx="80" cy="66" r="3.2"/>
    <circle cx="140" cy="66" r="3.2"/>
    <circle cx="64" cy="95" r="3.2"/>
    <circle cx="156" cy="95" r="3.2"/>
    <circle cx="80" cy="124" r="3.2"/>
    <circle cx="140" cy="124" r="3.2"/>
  </g>
  <g fill="#7d8e99">
    <circle cx="80" cy="66" r="1"/>
    <circle cx="140" cy="66" r="1"/>
    <circle cx="64" cy="95" r="1"/>
    <circle cx="156" cy="95" r="1"/>
    <circle cx="80" cy="124" r="1"/>
    <circle cx="140" cy="124" r="1"/>
  </g>

  <!-- Vapor (animado): cada onda sube, se ondula y se desvanece -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#soft)">
    <g class="wisp w1"><path class="sway" d="M86 40q-8-8 0-15t0-15" stroke-opacity="0.7"/></g>
    <g class="wisp w2"><path class="sway" d="M110 38q8-8 0-16t0-14" stroke-opacity="0.8"/></g>
    <g class="wisp w3"><path class="sway" d="M134 40q-8-8 0-15t0-15" stroke-opacity="0.65"/></g>
  </g>
</svg>
